# Publica en el Marketplace de VS Code (y en Open VSX si hay token) al subir una etiqueta vX.Y.Z
# que coincida con la versión de package.json. Secretos: VSCE_PAT (obligatorio) y OVSX_PAT (opcional).
name: Publicar

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La etiqueta coincide con la versión
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: xvfb-run -a npm run test:integration
      - run: npm run package
      - name: Marketplace de VS Code
        run: npx vsce publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Versión en GitHub con el .vsix
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes "Ver CHANGELOG.md"
        env:
          GH_TOKEN: ${{ github.token }}
