# Al subir una etiqueta vX.Y.Z (igual que la versión de package.json):
# 1. pasa las pruebas y crea una versión en GitHub con el .vsix para descargarlo;
# 2. si existen los secretos, publica en el Marketplace de VS Code (VSCE_PAT) y en Open VSX (OVSX_PAT).
name: Publicar

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La etiqueta coincide con la versión
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: xvfb-run -a npm run test:integration
      - run: npm run package
      - name: Versión en GitHub con el .vsix
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "Web Code Stats $GITHUB_REF_NAME" --notes "Descarga el .vsix de abajo e instálalo en VS Code (Extensiones → … → Instalar desde VSIX) o súbelo al Marketplace. Cambios: CHANGELOG.md."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Marketplace de VS Code
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --no-dependencies --packagePath *.vsix
      - name: Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish *.vsix
